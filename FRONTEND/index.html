<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PICKLERS | FIND • BOOK • PLAY</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="description"
    content="Delivers a fully responsive, accessible UI design system with polished components and seamless layouts tailored for diverse devices and user needs." />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
      (function() {
        try {
          var localTheme = window.localStorage.getItem('theme');
          var systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var theme = localTheme || systemTheme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>

<body>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

</body>

</html>
